minecraft_version=26.2
fabric_minecraft_version_range=>=26.2 <=26.2
neoforge_minecraft_version_range=[26.2,26.2]

# 26.1+ ships unobfuscated, so Loom applies the Fabric access widener with `readOfficial` and
# rejects any other namespace. The `named` copy is still required for the AW->AT conversion
# that feeds NeoForge, because Fletching-Table's AW lexer cannot parse `official`.
access_widener_namespace=official

## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.161.0+26.2
fabric_loader_version=0.20.1

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.93
neoforge_loader_version_range=[4,)

# https://modrinth.com/mod/modmenu/versions?g=26.2
mod_menu_version=20.0.3

# Java 25 since 26.1
java_version=25
