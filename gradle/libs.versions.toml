# Dependencies shared across Minecraft targets. Target-specific Minecraft, loader,
# mappings and Mod Menu versions belong in versions/<minecraft>/gradle.properties.
[versions]
prism4j = "2.0.0"
joor = "0.9.15"
nv-websocket = "2.14"
javassist = "3.30.2-GA"
mixinextras = "0.3.5"
graal = "24.0.1"
junit = "5.8.1"

[libraries]
mixin = { module = "org.spongepowered:mixin", version = "0.8.5" }
mixinextras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
asm-tree = { module = "org.ow2.asm:asm-tree", version = "9.6" }
prism4j = { module = "io.noties:prism4j", version.ref = "prism4j" }
joor = { module = "org.jooq:joor", version.ref = "joor" }
nv-websocket = { module = "com.neovisionaries:nv-websocket-client", version.ref = "nv-websocket" }
javassist = { module = "org.javassist:javassist", version.ref = "javassist" }

slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.16" }
# Keep Guava 31.1: the extension's version must align with NeoForge.
guava-extension = { module = "com.google.guava:guava", version = "31.1-jre" }
gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
fastutil = { module = "it.unimi.dsi:fastutil", version = "8.5.15" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "20.1.0" }

graal-sdk = { module = "org.graalvm.sdk:graal-sdk", version.ref = "graal" }
graal-collections = { module = "org.graalvm.sdk:collections", version.ref = "graal" }
graal-nativeimage = { module = "org.graalvm.sdk:nativeimage", version.ref = "graal" }
graal-word = { module = "org.graalvm.sdk:word", version.ref = "graal" }
graal-nativebridge = { module = "org.graalvm.sdk:nativebridge", version.ref = "graal" }
graal-jniutils = { module = "org.graalvm.sdk:jniutils", version.ref = "graal" }
graal-truffle-api = { module = "org.graalvm.truffle:truffle-api", version.ref = "graal" }
graal-truffle-enterprise = { module = "org.graalvm.truffle:truffle-enterprise", version.ref = "graal" }
graal-truffle-runtime = { module = "org.graalvm.truffle:truffle-runtime", version.ref = "graal" }
graal-truffle-compiler = { module = "org.graalvm.truffle:truffle-compiler", version.ref = "graal" }
graal-regex = { module = "org.graalvm.regex:regex", version.ref = "graal" }
graal-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graal" }
graal-js-runtime = { module = "org.graalvm.polyglot:js", version.ref = "graal" }
graal-js-language = { module = "org.graalvm.js:js-language", version.ref = "graal" }
graal-python-runtime = { module = "org.graalvm.polyglot:python", version.ref = "graal" }
graal-python-community = { module = "org.graalvm.polyglot:python-community", version.ref = "graal" }
graal-python-language = { module = "org.graalvm.python:python-language", version.ref = "graal" }
graal-python-resources = { module = "org.graalvm.python:python-resources", version.ref = "graal" }
graal-llvm-runtime = { module = "org.graalvm.polyglot:llvm", version.ref = "graal" }
graal-llvm-community = { module = "org.graalvm.polyglot:llvm-community", version.ref = "graal" }
graal-llvm-api = { module = "org.graalvm.llvm:llvm-api", version.ref = "graal" }
graal-chromeinspector = { module = "org.graalvm.tools:chromeinspector-tool", version.ref = "graal" }
graal-profiler = { module = "org.graalvm.tools:profiler-tool", version.ref = "graal" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.2.10" }
ksp = { id = "com.google.devtools.ksp", version = "2.2.10-2.0.2" }
fletching-common = { id = "dev.kikugie.fletching-table", version = "0.1.0-alpha.22" }
fletching-fabric = { id = "dev.kikugie.fletching-table.fabric", version = "0.1.0-alpha.22" }
fletching-neoforge = { id = "dev.kikugie.fletching-table.neoforge", version = "0.1.0-alpha.22" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version = "2.2.0" }
