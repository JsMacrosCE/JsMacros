name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Stonecutter needs this to detach the active source state and configure the
  # full version matrix. Actions sets it implicitly, but not by contract.
  CI: 'true'
  JAVA_VERSION: '25'

jobs:
  compile:
    name: Compile ${{ matrix.mc_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors usesFabricRemap() in stonecutter.gradle.kts.
          - mc_version: '1.21.5'
            fabric_package_task: remapJar
          - mc_version: '1.21.8'
            fabric_package_task: remapJar
          - mc_version: '1.21.10'
            fabric_package_task: remapJar
          - mc_version: '1.21.11'
            fabric_package_task: remapJar
          - mc_version: '26.1.2'
            fabric_package_task: jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-overwrite-existing: true

      # `classes` runs stonecutterGenerate, resource processing and compilation.
      # The packaging task catches mixin remap problems, and
      # validateAccessWidener is the only member-level check on access wideners
      # (the NeoForge access transformer is a plain text conversion of the same
      # file and resolves nothing).
      - name: Compile ${{ matrix.mc_version }}
        run: |
          ./gradlew --console=plain --stacktrace \
            :common:${{ matrix.mc_version }}:classes \
            :fabric:${{ matrix.mc_version }}:classes \
            :neoforge:${{ matrix.mc_version }}:classes \
            :fabric:${{ matrix.mc_version }}:validateAccessWidener \
            :fabric:${{ matrix.mc_version }}:${{ matrix.fabric_package_task }}

      # Loom only validates the -official widener, so guard against the one
      # common/NeoForge convert drifting away from it. Header line may differ.
      - name: Check 26.1 access wideners are in sync
        if: matrix.mc_version == '26.1.2'
        run: |
          diff <(tail -n +2 common/src/main/resources/accesswideners/26.1.2-jsmacrosce.accesswidener) \
               <(tail -n +2 common/src/main/resources/accesswideners/26.1.2-jsmacrosce-official.accesswidener)

  extensions:
    name: Compile extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-overwrite-existing: true

      # These subprojects are not versioned by Stonecutter and compile against
      # stonecutter.active. :extension has no main sources (just the test stubs
      # the graal modules need) and its test task is disabled.
      - name: Compile extension modules
        run: |
          echo "Extensions compile against Minecraft $(tr -d '[:space:]' < stonecutter.active)"
          ./gradlew --console=plain --stacktrace \
            :extension:testClasses \
            :extension:graal:classes \
            :extension:graal:js:classes \
            :extension:graal:js:testClasses \
            :extension:graal:python:classes \
            :extension:graal:python:testClasses
